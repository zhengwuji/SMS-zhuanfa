name: Build Release APK

# ============================================================
# 触发条件
#   push 到 main/master  → 编译并发布 Pre-release（预发布）
#   push tag (v*)        → 编译并发布正式 Release
#   手动触发             → 按输入决定发布类型
# ============================================================
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: '发布类型'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - prerelease
          - release
          - none

# 允许工作流写入仓库内容（创建 Release 所需）
permissions:
  contents: write

# 同一分支的构建串行执行，避免并发冲突
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 编译 APK 并发布
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ---------- 1. 检出代码（需完整历史以生成变更日志）----------
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 2. 配置 JDK 17 ----------
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---------- 3. 配置 Android SDK ----------
      # ubuntu-latest 镜像已预装 Android SDK，直接复用，避免第三方 action 的不确定性
      - name: 配置 Android SDK
        run: |
          set -e
          # 定位预装的 SDK
          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"
          else
            echo "未找到预装 SDK，执行安装"
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            cd /tmp
            curl -sSL -o cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip -d /tmp/ct
            mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
            mv /tmp/ct/cmdline-tools/* "$HOME/android-sdk/cmdline-tools/latest/"
            SDK_ROOT="$HOME/android-sdk"
          fi

          echo "SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV

          # 定位 sdkmanager
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            SDKMGR="$SDK_ROOT/cmdline-tools/bin/sdkmanager"
          else
            SDKMGR=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)
          fi

          echo "SDKMANAGER=$SDKMGR"
          if [ -z "$SDKMGR" ]; then
            echo "未找到 sdkmanager"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "SDKMGR=$SDKMGR" >> $GITHUB_ENV

          # 加入 PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$(dirname $SDKMGR)" >> $GITHUB_PATH

      - name: 安装 SDK 组件
        run: |
          set -e
          yes | "$SDKMGR" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "platform-tools"
          echo "=== 已安装组件 ==="
          ls -1 "$ANDROID_SDK_ROOT/platforms"
          ls -1 "$ANDROID_SDK_ROOT/build-tools"

      # ---------- 4. 配置 Gradle 缓存（大幅提速）----------
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # ---------- 5. 准备签名密钥 ----------
      # 优先级：① GitHub Secret（固定签名，推荐）→ ② Actions 缓存 → ③ 新生成
      # 目的：保证不同构建之间签名一致，APK 可直接覆盖安装
      - name: 恢复缓存的签名密钥
        id: keystore_cache
        uses: actions/cache@v4
        with:
          path: keystore/pppscn.jks
          # v2：修复早期版本可能缓存了无效文件的问题
          key: android-keystore-pppscn-v2

      - name: 准备签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "=== 签名密钥准备 ==="
          mkdir -p keystore

          SOURCE=""

          # ① 优先使用 Secret 中的固定密钥
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "检测到 Secret，解码固定密钥..."
            if echo "$KEYSTORE_BASE64" | base64 -d > keystore/pppscn.jks 2>/dev/null \
               && [ -s keystore/pppscn.jks ]; then
              echo "解码成功"
              SOURCE="Secret"
            else
              echo "解码失败，回退到其他方式"
              rm -f keystore/pppscn.jks
            fi
          fi

          # ② 使用缓存恢复的密钥（校验文件有效性，避免半成品）
          if [ -z "$SOURCE" ] && [ -s keystore/pppscn.jks ]; then
            if keytool -list -keystore keystore/pppscn.jks -storepass pppscn >/dev/null 2>&1; then
              echo "使用缓存中的有效密钥"
              SOURCE="Cache"
            else
              echo "缓存密钥无效，将重新生成"
              rm -f keystore/pppscn.jks
            fi
          fi

          # ③ 生成新密钥
          if [ -z "$SOURCE" ]; then
            echo "生成新的签名密钥（后续构建将通过缓存复用）"
            keytool -genkeypair \
              -keystore keystore/pppscn.jks \
              -alias pppscn \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass pppscn -keypass pppscn \
              -dname "CN=pppscn, OU=Dev, O=local, L=Beijing, ST=Beijing, C=CN"
            SOURCE="Generated"
          fi

          # 写出版本信息供后续步骤引用
          echo "KEYSTORE_SOURCE=$SOURCE" >> $GITHUB_ENV

          # 校验最终密钥可用
          if ! keytool -list -keystore keystore/pppscn.jks -storepass pppscn >/dev/null 2>&1; then
            echo "错误：签名密钥不可用"
            exit 1
          fi

          # 写出签名配置
          printf '%s\n' \
            'storeFile=../keystore/pppscn.jks' \
            'storePassword=pppscn' \
            'keyAlias=pppscn' \
            'keyPassword=pppscn' \
            > keystore/keystore.properties

          echo "=== 签名配置 ==="
          cat keystore/keystore.properties

          echo "=== 签名来源: $SOURCE ==="
          echo "=== 证书指纹 ==="
          keytool -list -keystore keystore/pppscn.jks -storepass pppscn 2>/dev/null \
            | grep -iE "SHA256|SHA-256" || echo "（未获取）"

      # ---------- 6. 设置 local.properties ----------
      - name: 配置 SDK 路径
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "APP_ID_UMENG=60254fc7425ec25f10f4293e" >> local.properties

      # ---------- 7. 赋予 gradlew 执行权限 ----------
      - name: 赋予执行权限
        run: chmod +x ./gradlew

      # ---------- 8. 编译 Release APK ----------
      - name: 编译 Release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

      # ---------- 9. 收集产物并计算校验值 ----------
      - name: 收集 APK 与校验值
        id: collect
        run: |
          set -e
          APK_DIR="build/app/outputs/apk/release"
          OUT_DIR="release-assets"
          mkdir -p "$OUT_DIR"

          echo "=== 编译产物 ==="
          ls -lh "$APK_DIR"/*.apk || { echo "未找到 APK，编译失败"; exit 1; }

          cp "$APK_DIR"/*.apk "$OUT_DIR/"

          cd "$OUT_DIR"
          sha256sum *.apk > SHA256SUMS.txt
          echo "=== SHA256 校验值 ==="
          cat SHA256SUMS.txt

          # 校验签名有效性
          echo ""
          echo "=== 签名校验 ==="
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            for apk in *.apk; do
              if "$APKSIGNER" verify --print-certs "$apk" > /tmp/sig.txt 2>&1; then
                DN=$(grep -i "certificate DN" /tmp/sig.txt | head -1 | cut -d: -f2- | xargs)
                echo "  OK   $apk  [$DN]"
              else
                echo "  FAIL $apk 签名校验失败"
                cat /tmp/sig.txt
                exit 1
              fi
            done
          else
            echo "  未找到 apksigner，跳过校验"
          fi

          COUNT=$(ls -1 *.apk | wc -l)
          TOTAL=$(du -sh . | cut -f1)
          echo "apk_count=$COUNT" >> $GITHUB_OUTPUT
          echo "total_size=$TOTAL" >> $GITHUB_OUTPUT
          echo "签名校验通过，共 $COUNT 个 APK"

      # ---------- 10. 生成版本号与标签 ----------
      - name: 生成版本标识
        id: version
        run: |
          BASE_VER=$(grep -oP "version_name\s*=\s*['\"]\K[^'\"]+" versions.gradle || echo "3.5.0")
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${BASE_VER}-build.${DATE}.${SHORT_SHA}"
          fi

          echo "base_version=$BASE_VER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "日期: $DATE / 标签: $TAG"

      # ---------- 11. 生成更新说明（核心：自动汇总变更）----------
      - name: 生成更新说明
        id: changelog
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            if git rev-parse HEAD~20 >/dev/null 2>&1; then
              RANGE="HEAD~20..HEAD"
            else
              RANGE="HEAD"
            fi
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          echo "变更范围: $RANGE"

          {
            echo "## 📝 更新内容"
            echo ""

            FEATS=$(git log $RANGE --pretty=format:"%s" 2>/dev/null | grep -E "^(feat|feature|新增|添加)" || true)
            if [ -n "$FEATS" ]; then
              echo "### ✨ 新功能"
              echo "$FEATS" | sed 's/^/- /'
              echo ""
            fi

            FIXES=$(git log $RANGE --pretty=format:"%s" 2>/dev/null | grep -E "^(fix|修复|bugfix)" || true)
            if [ -n "$FIXES" ]; then
              echo "### 🐛 问题修复"
              echo "$FIXES" | sed 's/^/- /'
              echo ""
            fi

            PERFS=$(git log $RANGE --pretty=format:"%s" 2>/dev/null | grep -E "^(perf|opt|优化|改进|refactor|重构)" || true)
            if [ -n "$PERFS" ]; then
              echo "### ⚡ 优化改进"
              echo "$PERFS" | sed 's/^/- /'
              echo ""
            fi

            DOCS=$(git log $RANGE --pretty=format:"%s" 2>/dev/null | grep -E "^(docs|doc|文档)" || true)
            if [ -n "$DOCS" ]; then
              echo "### 📚 文档"
              echo "$DOCS" | sed 's/^/- /'
              echo ""
            fi

            OTHERS=$(git log $RANGE --pretty=format:"%s" 2>/dev/null | grep -vE "^(feat|feature|新增|添加|fix|修复|bugfix|perf|opt|优化|改进|refactor|重构|docs|doc|文档|Merge|chore)" || true)
            if [ -n "$OTHERS" ]; then
              echo "### 🔧 其他变更"
              echo "$OTHERS" | sed 's/^/- /'
              echo ""
            fi

            echo "---"
            echo ""
            echo "## 📊 变更统计"
            echo ""
            echo '```'
            git diff --stat $RANGE 2>/dev/null | tail -1 || echo "（无统计数据）"
            echo '```'
            echo ""
            echo "## 🔀 提交明细"
            echo ""
            echo '```'
            git log $RANGE --pretty=format:"%h %ad %an: %s" --date=short 2>/dev/null || echo "（无提交记录）"
            echo ""
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "## 📦 下载"
            echo ""
            echo "| 文件 | 适用设备 |"
            echo "|---|---|"
            echo "| \`*_universal_release.apk\` | **通用包，推荐**（含全部架构） |"
            echo "| \`*_arm64-v8a_release.apk\` | 现代手机（2016 年后） |"
            echo "| \`*_armeabi-v7a_release.apk\` | 老机型（32 位 ARM） |"
            echo ""
            echo "APK 的 SHA256 校验值见附件 \`SHA256SUMS.txt\`。"
            echo ""
            echo "---"
            echo ""
            echo "**构建信息**"
            echo "- 版本：\`${{ steps.version.outputs.base_version }}\`"
            echo "- 提交：\`${{ steps.version.outputs.short_sha }}\`"
            echo "- 构建时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- 仓库：${{ github.repository }}"
            echo ""
            echo "完整变更对比：${{ github.server_url }}/${{ github.repository }}/compare/${PREV_TAG:-HEAD~20}...${TAG}"

          } > CHANGELOG_BODY.md

          echo "=== 生成的更新说明预览 ==="
          head -50 CHANGELOG_BODY.md

      # ---------- 12. 上传构建产物 ----------
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.short_sha }}
          path: release-assets/*.apk
          retention-days: 30

      # ---------- 13. 发布到 Releases ----------
      # 用 gh CLI 逐个上传：比 action 更稳，可精确重试，避免大文件上传挂起
      - name: 发布 Release 并上传 APK
        if: |
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.release_type != 'none'
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="SMS-zhuanfa ${{ steps.version.outputs.base_version }} (${{ steps.version.outputs.short_sha }})"

          # 判断是否预发布
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.release_type }}" = "release" ]; then
              PRE_FLAG=""
            else
              PRE_FLAG="--prerelease"
            fi
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            PRE_FLAG=""
          else
            PRE_FLAG="--prerelease"
          fi

          echo "标签: $TAG"
          echo "标题: $TITLE"
          echo "预发布参数: ${PRE_FLAG:-（正式版）}"

          # 若 Release 已存在则先删除，保证可重跑
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release 已存在，先删除以便重建"
            gh release delete "$TAG" --yes --cleanup-tag || true
            sleep 3
          fi

          # 创建 Release（正文来自自动生成的更新说明）
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file CHANGELOG_BODY.md \
            $PRE_FLAG

          echo "=== 开始上传附件 ==="

          # 逐个上传，每个文件最多重试 3 次
          upload_one() {
            local f="$1"
            local name
            name=$(basename "$f")
            for attempt in 1 2 3; do
              echo "[$attempt/3] 上传 $name ..."
              if gh release upload "$TAG" "$f" --clobber; then
                echo "成功: $name"
                return 0
              fi
              echo "失败，等待 10 秒后重试: $name"
              sleep 10
            done
            echo "最终失败: $name"
            return 1
          }

          FAILED=0
          # 先传校验文件（小），再传 APK
          upload_one "release-assets/SHA256SUMS.txt" || FAILED=1
          for f in release-assets/*.apk; do
            upload_one "$f" || FAILED=1
          done

          echo "=== 最终附件清单 ==="
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes"'

          if [ "$FAILED" -eq 1 ]; then
            echo "部分附件上传失败"
            exit 1
          fi

          echo "全部附件上传完成"

          # ---------- 清理旧的 Pre-release，只保留最近 N 个 ----------
          KEEP_COUNT=5
          echo ""
          echo "=== 清理旧版本（保留最近 $KEEP_COUNT 个预发布）==="

          # 只清理预发布版本，正式版（无 --prerelease 标记）永久保留
          OLD_TAGS=$(gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease == true)] | sort_by(.createdAt) | reverse | .['"$KEEP_COUNT"':] | .[].tagName' 2>/dev/null || echo "")

          if [ -n "$OLD_TAGS" ]; then
            for old_tag in $OLD_TAGS; do
              echo "  删除旧预发布: $old_tag"
              gh release delete "$old_tag" --yes --cleanup-tag || echo "    删除失败，跳过"
            done
          else
            echo "  无需清理"
          fi

          echo ""
          echo "=== 当前 Release 列表 ==="
          gh release list --limit 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 14. 构建总结 ----------
      - name: 构建总结
        if: always()
        run: |
          {
            echo "## 🎉 构建完成"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 版本 | ${{ steps.version.outputs.base_version }} |"
            echo "| 标签 | ${{ steps.version.outputs.tag }} |"
            echo "| 提交 | ${{ steps.version.outputs.short_sha }} |"
            echo "| APK 数量 | ${{ steps.collect.outputs.apk_count }} |"
            echo "| 总大小 | ${{ steps.collect.outputs.total_size }} |"
            echo ""
            echo "[查看 Release](https://github.com/${{ github.repository }}/releases)"
          } >> $GITHUB_STEP_SUMMARY
