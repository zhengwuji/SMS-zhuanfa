name: Build Release APK

# ============================================================
# 触发条件
#   push 到 main/master  → 编译并发布 Pre-release（预发布）
#   push tag (v*)        → 编译并发布正式 Release
#   手动触发             → 按输入决定发布类型
# ============================================================
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: '发布类型'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - prerelease
          - release
          - none

# 允许工作流写入仓库内容（创建 Release 所需）
permissions:
  contents: write

# 同一分支的构建串行执行，避免并发冲突
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 编译 APK 并发布
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ---------- 1. 检出代码（需完整历史以生成变更日志）----------
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 2. 配置 JDK 17 ----------
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---------- 3. 配置 Android SDK ----------
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          sdkmanager --install "platforms;android-33" "build-tools;33.0.1" "platform-tools"
          yes | sdkmanager --licenses || true

      # ---------- 4. 配置 Gradle 缓存（大幅提速）----------
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # ---------- 5. 生成签名文件 ----------
      - name: 生成签名密钥
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/pppscn.jks \
            -alias pppscn \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass pppscn -keypass pppscn \
            -dname "CN=pppscn, OU=Dev, O=local, L=Beijing, ST=Beijing, C=CN"

          cat > keystore/keystore.properties <<'EOF'
          storeFile=../keystore/pppscn.jks
          storePassword=pppscn
          keyAlias=pppscn
          keyPassword=pppscn
          EOF

      # ---------- 6. 设置 local.properties ----------
      - name: 配置 SDK 路径
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "APP_ID_UMENG=60254fc7425ec25f10f4293e" >> local.properties

      # ---------- 7. 赋予 gradlew 执行权限 ----------
      - name: 赋予执行权限
        run: chmod +x ./gradlew

      # ---------- 8. 编译 Release APK ----------
      - name: 编译 Release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

      # ---------- 9. 收集产物并计算校验值 ----------
      - name: 收集 APK 与校验值
        id: collect
        run: |
          set -e
          APK_DIR="build/app/outputs/apk/release"
          OUT_DIR="release-assets"
          mkdir -p "$OUT_DIR"

          echo "=== 编译产物 ==="
          ls -lh "$APK_DIR"/*.apk || { echo "未找到 APK，编译失败"; exit 1; }

          cp "$APK_DIR"/*.apk "$OUT_DIR/"

          cd "$OUT_DIR"
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

          COUNT=$(ls -1 *.apk | wc -l)
          TOTAL=$(du -sh . | cut -f1)
          echo "apk_count=$COUNT" >> $GITHUB_OUTPUT
          echo "total_size=$TOTAL" >> $GITHUB_OUTPUT

      # ---------- 10. 生成版本号与标签 ----------
      - name: 生成版本标识
        id: version
        run: |
          BASE_VER=$(grep -oP "version_name\s*=\s*['\"]\K[^'\"]+" versions.gradle || echo "3.5.0")
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${BASE_VER}-build.${DATE}.${SHORT_SHA}"
          fi

          echo "base_version=$BASE_VER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "日期: $DATE / 标签: $TAG"

      # ---------- 11. 生成更新说明（核心：自动汇总变更）----------
      - name: 生成更新说明
        id: changelog
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            if git rev-parse HEAD~20 >/dev/null 2>&1; then
              RANGE="HEAD~20..HEAD"
            else
              RANGE="HEAD"
            fi
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          echo "变更范围: $RANGE"

          {
            echo "## 📝 更新内容"
            echo ""

            FEATS=$(git log $RANGE --pretty=format:"%s" 2>/dev/null | grep -E "^(feat|feature|新增|添加)" || true)
            if [ -n "$FEATS" ]; then
              echo "### ✨ 新功能"
              echo "$FEATS" | sed 's/^/- /'
              echo ""
            fi

            FIXES=$(git log $RANGE --pretty=format:"%s" 2>/dev/null | grep -E "^(fix|修复|bugfix)" || true)
            if [ -n "$FIXES" ]; then
              echo "### 🐛 问题修复"
              echo "$FIXES" | sed 's/^/- /'
              echo ""
            fi

            PERFS=$(git log $RANGE --pretty=format:"%s" 2>/dev/null | grep -E "^(perf|opt|优化|改进|refactor|重构)" || true)
            if [ -n "$PERFS" ]; then
              echo "### ⚡ 优化改进"
              echo "$PERFS" | sed 's/^/- /'
              echo ""
            fi

            DOCS=$(git log $RANGE --pretty=format:"%s" 2>/dev/null | grep -E "^(docs|doc|文档)" || true)
            if [ -n "$DOCS" ]; then
              echo "### 📚 文档"
              echo "$DOCS" | sed 's/^/- /'
              echo ""
            fi

            OTHERS=$(git log $RANGE --pretty=format:"%s" 2>/dev/null | grep -vE "^(feat|feature|新增|添加|fix|修复|bugfix|perf|opt|优化|改进|refactor|重构|docs|doc|文档|Merge|chore)" || true)
            if [ -n "$OTHERS" ]; then
              echo "### 🔧 其他变更"
              echo "$OTHERS" | sed 's/^/- /'
              echo ""
            fi

            echo "---"
            echo ""
            echo "## 📊 变更统计"
            echo ""
            echo '```'
            git diff --stat $RANGE 2>/dev/null | tail -1 || echo "（无统计数据）"
            echo '```'
            echo ""
            echo "## 🔀 提交明细"
            echo ""
            echo '```'
            git log $RANGE --pretty=format:"%h %ad %an: %s" --date=short 2>/dev/null || echo "（无提交记录）"
            echo ""
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "## 📦 下载"
            echo ""
            echo "| 文件 | 适用设备 |"
            echo "|---|---|"
            echo "| \`*_universal_release.apk\` | **通用包，推荐** |"
            echo "| \`*_arm64-v8a_release.apk\` | 现代手机（arm64） |"
            echo "| \`*_armeabi-v7a_release.apk\` | 老机型（32 位 ARM） |"
            echo "| \`*_x86_release.apk\` | x86 模拟器 |"
            echo "| \`*_x86_64_release.apk\` | x86_64 模拟器 |"
            echo ""
            echo "APK 的 SHA256 校验值见附件 \`SHA256SUMS.txt\`。"
            echo ""
            echo "---"
            echo ""
            echo "**构建信息**"
            echo "- 版本：\`${{ steps.version.outputs.base_version }}\`"
            echo "- 提交：\`${{ steps.version.outputs.short_sha }}\`"
            echo "- 构建时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- 仓库：${{ github.repository }}"
            echo ""
            echo "完整变更对比：${{ github.server_url }}/${{ github.repository }}/compare/${PREV_TAG:-HEAD~20}...${TAG}"

          } > CHANGELOG_BODY.md

          echo "=== 生成的更新说明预览 ==="
          head -50 CHANGELOG_BODY.md

      # ---------- 12. 上传构建产物 ----------
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.short_sha }}
          path: release-assets/*.apk
          retention-days: 30

      # ---------- 13. 发布到 Releases ----------
      - name: 发布 Release
        if: |
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.release_type != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SMS-zhuanfa ${{ steps.version.outputs.base_version }} (${{ steps.version.outputs.short_sha }})"
          body_path: CHANGELOG_BODY.md
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_type == 'prerelease' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 14. 构建总结 ----------
      - name: 构建总结
        if: always()
        run: |
          {
            echo "## 🎉 构建完成"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 版本 | ${{ steps.version.outputs.base_version }} |"
            echo "| 标签 | ${{ steps.version.outputs.tag }} |"
            echo "| 提交 | ${{ steps.version.outputs.short_sha }} |"
            echo "| APK 数量 | ${{ steps.collect.outputs.apk_count }} |"
            echo "| 总大小 | ${{ steps.collect.outputs.total_size }} |"
            echo ""
            echo "[查看 Release](https://github.com/${{ github.repository }}/releases)"
          } >> $GITHUB_STEP_SUMMARY
